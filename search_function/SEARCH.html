  <meta charset="UTF-8" />

  <title>GoatS RevengE - Search</title>

  <link rel="icon" type="image/png" href="https://github.com/franzzinho/GoatS-RevengE/blob/main/icona_sito.png">

    
  <style>
   
    
    /* === NEON EFFECTS === */
    
    @keyframes neonPulse {
    
      0%, 100% { box-shadow: 0 0 10px #00ff91, inset 0 0 5px #00ff91; }
      
      50% { box-shadow: 0 0 20px #00ff91, inset 0 0 10px #00ff91; }
    }


    body {
      
      background-color: #0b0b0b;
      
      color: #fff;
      
      font-family: "Poppins", sans-serif;
      
      margin: 0;
      
      padding: 0;

      box-sizing: border-box;
    }


    
    /* NAVBAR */
    
    nav {
    
      background: linear-gradient(90deg, #111, #1a1a1a);
      
      display: flex;
      
      justify-content: space-between;
      
      align-items: center;
      
      padding: 20px;
      
      position: sticky;
      
      top: 0;
      
      z-index: 1000;
      
      box-shadow: 0 0 15px #ffcc00;
    }
    
    nav .logo a {
    
      font-size: 1.3rem;
      
      font-weight: bold;
      
      color: #ffcc00;
      
      text-shadow: 0 0 5px #ffcc00, 0 0 15px #ffcc00, 0 0 30px #ffcc00;
      
      animation: neon-yellow 1.5s infinite alternate;
      
      text-decoration: none;
    }
    
    nav .logo .arrow {
    
      font-size: 1.5rem;
      
      margin-left: 10px;
      
      color: #ff00ff;
      
      text-shadow: 0 0 5px #ff00ff, 0 0 15px #ff00ff, 0 0 30px #ff00ff;
      
      animation: neon-purple 1.5s infinite alternate;
    }
    
    @keyframes neon-yellow {
    
      from { text-shadow: 0 0 5px #ffcc00, 0 0 15px #ffcc00; }
      
      to   { text-shadow: 0 0 10px #ffcc00, 0 0 25px #ffcc00, 0 0 40px #ffaa00; }
    }
    
    @keyframes neon-purple {
    
      from { text-shadow: 0 0 5px #ff00ff, 0 0 15px #ff00ff; }
      
      to   { text-shadow: 0 0 10px #ff00ff, 0 0 25px #ff00ff, 0 0 40px #cc00ff; }
    }


    
    /* === SEARCH BAR === */
    
    .search-bar {
   
      display: flex;
      
      align-items: center;
      
      gap: 8px;
    }

    #searchQuery {
      
      background-color: transparent;
      
      border: 2px solid #00ff91;
      
      color: #fff;
      
      padding: 8px 12px;
      
      border-radius: 10px;
      
      font-size: 16px;
      
      outline: none;
      
      text-shadow: 0 0 10px #00ff91;
      
      animation: neonPulse 2s infinite alternate;
    }

    #searchQuery::placeholder {
     
      color: #aaa;
    }

    button {
      
      background: #00ff91;
      
      border: none;
      
      border-radius: 8px;
      
      padding: 8px 14px;
      
      color: #000;
      
      cursor: pointer;
      
      font-weight: bold;
      
      box-shadow: 0 0 10px #00ff91;
      
      transition: 0.3s;
    }

    button:hover {
      
      box-shadow: 0 0 20px #00ff91, inset 0 0 10px #00ff91;
      
      transform: scale(1.05);
    }


    
    /* === PAGE HEADER === */
    h1 {
    
      text-shadow: 0 0 15px #00ff91;
      
      margin-bottom: 10px;
      
      font-size: 28px;
      
      animation: neonPulse 2s infinite alternate;
    }

    #results-count {
      
      color: #aaa;
      
      margin-bottom: 25px;
    }

    
    /* === RESULTS BOX === */
    .result {
    
      background: rgba(0, 255, 145, 0.05);
      
      border: 1px solid #00ff9140;
      
      border-radius: 12px;
      
      padding: 15px;
      
      margin-bottom: 40px;
      
      box-shadow: 0 0 10px #00ff9120;
      
      transition: 0.3s;
      
      position: relative;
    }

    .result:hover {
      
      transform: scale(1.02);
      
      box-shadow: 0 0 20px #00ff9160;
    }

    .result::after {
      
      content: "";
      
      position: absolute;
      
      bottom: -20px;
      
      left: 0;
      
      width: 100%;
      
      height: 2px;
      
      background: linear-gradient(90deg, transparent, #00ff91, transparent);
      
      box-shadow: 0 0 10px #00ff91;
    }

    .result h3 a {
      
      color: #00ff91;
      
      text-decoration: none;
    }

    /* === HIGHLIGHTED WORD === */
    mark {
      background: #00ff91;
      color: #000;
      font-weight: bold;
      border-radius: 3px;
      padding: 1px 3px;
      text-decoration: underline;
    }

    .snippet {
      
      color: #fff;
      
      margin-top: 10px;
      
      line-height: 1.4;
    }
    
  </style>

  </head>

  <body>


    
  <!-- NAVBAR -->
  
    <nav class="navbar">
    
      <div class="logo">
    
        <a href="../index.html">🐐 GoatS RevengE 🧠</a>

      </div>

    <form id="searchForm" class="search-bar">
      
      <button type="submit">🔍</button>
    
    </form>
  
    </nav>

  <h1>🔎 Risultati della ricerca 🔎:</h1>
    
  <p id="results-count"></p>
  
    <div id="results"></div>
