<!DOCTYPE html>
<html>
<head>
<title>Gioco</title>
<script>
'use strict';
var tag = null;        // IL TAG DEL CANVAS
var contesto = null;   // CONTESTO DEL CANVAS
var oggetti = [];      // TUTTI GLI OGGETTI DA DISEGNARE
var colori = [         // POSSIBILI COLORI PER LE PALLINE
    "red", "orange", "green", "yellow",
    "lime", "magenta", "blue", "purple",
    "pink", "gold", "greenyellow", "peru"];
var funzioneATempo = null; // EVENTUALI FUNZIONI INNOVATE A INTERVALLI DI TEMPO
                           // PREDEFINITI
var punti = null;          // PUNTEGGIO OTTENUTO

// CALCOLA LA DISTANZA TRA DUE PUNTI
function distanza(x1, y1, x2 = 0, y2 = 0) {
    let diffX = x1 - x2;
    let diffY = y1 - y2;
    return Math.sqrt(diffX * diffX + diffY * diffY);
}

// GENERA UN NUMERO CASUALE INTERO TRA I DUE ESTREMI [da, a]
// SE zeroEscluso È A TRUE, GENERA UN NUMERO DIVERSO DA ZERO
function casuale(da, a, zeroEscluso = false) {
    let interv = a - da + 1;
    let numero = Math.floor(Math.random()*(interv)) + da;
    while(numero==0 && zeroEscluso) {
        numero = Math.floor(Math.random()*(interv)) + da;
    }
    return numero;
}

this.colore = colore;        // POSIZIONE INIZIALE ASSE X
this.x = x;                  // POSIZIONE INIZIALE ASSE X
this.y = y;                  // POSIZIONE INIZIALE ASSE Y
this.limiteX = limiteX;      // LIMITE DESTRO DEL BORDO
this.limiteY = limiteY;      // LIMITE BASSO DEL BORDO
this.dx = casuale(-2, 2, true); // INCREMENTO ASSE X
this.dy = casuale(-2, 2, true); // INCREMENTO ASSE Y

this.colpita = function(clickX, clickY) {
    return (distanza(clickX, clickY, this.x, this.y) <= raggio);
}

this.muovi = function() {
    // IL MOVIMENTO AVVIENE AUMENTANDO (O DIMINUENDO) LE DUE COORDINATE
    this.x += this.dx;
    this.y += this.dy;

    // IL RIMBALZO SI OTTIENE INVERTENDO IL SEGNO DELL'INCREMENTO DELLA COORDINATA
    // CHE HA TOCCATO IL BORDO (ANCHE ENTRAMBE)

    // RIMBALZA SE SUL BORDO DESTRO
    if (this.x + this.raggio >= this.limiteX) {
        this.x = this.limiteX - this.raggio;
        this.dx = -this.dx;
    }
    // RIMBALZA SE SUL BORDO SINISTRO
    else if (this.x - this.raggio <= 0) {
        this.x = this.raggio;
        this.dx = -this.dx;
    }
    // RIMBALZA SE SUL BORDO IN BASSO
    if (this.y + this.raggio >= this.limiteY) {
        this.y = this.limiteY - this.raggio;
        this.dy = -this.dy;
    }
    // RIMBALZA SE SUL BORDO IN ALTO
    else if (this.y - this.raggio <= 0) {
        this.y = this.raggio;
        this.dy = -this.dy;
    }
};
this.disegna = function() {
    contesto.beginPath();
    contesto.fillStyle = this.colore;
    contesto.arc(this.x, this.y, this.raggio, 0, Math.PI * 2);
    contesto.fill();
    contesto.stroke();
    contesto.closePath();
}
}

function Punteggio(x, y) {
    this.x = x;
    this.y = y;
    this.punti = 0;

    this.disegna = function() {
        contesto.beginPath();
        contesto.fillStyle = "black";
        contesto.font = "28px Arial";
        contesto.fillText(
            `Punteggio: ${(this.punti)}`, this.x, this.y);
        contesto.stroke();
        contesto.closePath();
    }
}

function inizioGioco() {
    tag = document.getElementById("canvas");
    contesto = tag.getContext("2d");
    pulisciVecchioGioco();
    punti = new Punteggio(tag.width/2-100,tag.height-30);
    oggetti.push(punti);
    let numero = document.getElementById("palline").value;
    for(let i = 0; i < numero; i++) {
        oggetti.push(
            new Pallina(
                casuale(12, 25),       // DIMENSIONE INIZIALE
                casuale(10, tag.width-10),  // X INIZIALE
                casuale(10, tag.height-10), // Y INIZIALE
                colori[ casuale(0, colori.length-1) ]) // COLORE
        );
    }
    if (funzioneATempo) clearInterval (funzioneATempo);
    funzioneATempo = setInterval(disegna, 10);
    tag.addEventListener("mousedown", getPosizione);
}

function pulisciVecchioGioco() {
    // RIPRISTINA LA SITUAZIONE INIZIALE
    if (funzioneATempo) {
        clearInterval( funzioneATempo );
        funzioneATempo = null;
    }
    oggetti = [];
    tag.removeEventListener("mousedown", getPosizione);
}

function getPosizione(event) {
    const rect = tag.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    for(let elem of oggetti) {
        if (elem.colpita?(x, y)) {
            punti.punti += 1;
            if ((elem.raggio - 5) < 5)
                elem.raggio = 0;
            else
                elem.raggio -= 5;
        }
    }
}

var valore = 0; // PER "ANIMARE" I COLORI DELLA SCRITTA
